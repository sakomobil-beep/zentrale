name: Handy-Benachrichtigungen
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch: {inputs: {test: {description: 'Testnachricht senden', type: boolean, default: true}}}
permissions: {contents: write}
concurrency: notify
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Testnachricht
        if: ${{ inputs.test }}
        run: curl -s -H "Title: Zentrale verbunden" -H "Tags: white_check_mark" -d "Die Benachrichtigungen funktionieren 👍" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
      - name: Prüfen & senden
        env:
          ZENTRALE_PW: ${{ secrets.ZENTRALE_PW }}
          DATEN_TOKEN: ${{ secrets.DATEN_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node .notify/notify.mjs
      - name: Zustand merken
        run: |
          git diff --quiet .notify/state.json 2>/dev/null && exit 0
          git config user.name "zentrale-bot"; git config user.email "bot@users.noreply.github.com"
          git add .notify/state.json; git commit -m "Benachrichtigungs-Status [skip ci]"; git push
